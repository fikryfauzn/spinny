[package]
name = "vdisc_qml_bridge"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
qml = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]

[dependencies]
cxx = { version = "1", optional = true }
cxx-qt = { version = "=0.10.0", optional = true }
cxx-qt-lib = { version = "=0.10.0", optional = true }
vdisc-appliance = { path = "../vdisc-appliance" }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", features = ["link_qt_object_files"], optional = true }
