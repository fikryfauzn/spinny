[package]
name = "vdisc-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["mp3"] }
symphonia-adapter-libopus = "0.3.0"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
hound = "3.5.1"
tempfile = "3"
